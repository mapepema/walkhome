<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Walkhome</title>
    <meta name="description" content="A treadmill quest for the whole household: move along the road, earn cards, overtake each other." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0b09" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Walkhome" />
    <meta property="og:description" content="A treadmill quest for the whole household: move along the road, earn cards, overtake each other." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="Walkhome" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { margin: 0; background: #0d0b09; }
      /* boot splash: painted before the JS bundle arrives */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0b09; }
      #boot img { width: 112px; height: 112px; border-radius: 26px; animation: bs 1.4s ease-in-out infinite; }
      @keyframes bs { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/icons/icon-192.png" alt="Walkhome" /></div></div>
    <noscript>Walkhome needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
